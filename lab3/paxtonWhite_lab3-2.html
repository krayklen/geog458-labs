<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 3: Seattle Bike Rack Density</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">
    <style>
        body {
            margin: 0;
            font: 14px/1.5 Arial, sans-serif;
            color: #182e3a;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 16px;
            width: 260px;
            max-width: calc(100% - 100px);
            background: white;
            max-height: calc(100% - 80px);
            overflow: auto;
            border-radius: 6px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        p {
            margin: 8px 0;
        }

        .ramp {
            height: 14px;
            background: linear-gradient(to right,
                    #edf8e9, #c7e9c0, #a1d99b, #41ab5d, #006d2c);
        }

        .values {
            display: flex;
            justify-content: space-between;
        }

        .maplibregl-popup-content {
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <section id="panel">
        <h1>Seattle Bike Rack Density</h1>
        <p>Source: City of Seattle SDOT</p>
        <p id="status">Step 1: map frame ready; add the basemap next.</p>
        <div id="surface-control" hidden>
            <label><input id="show-surface" type="checkbox" checked> Show density surface</label>
        </div>
        <div id="station-control" hidden>
            <label><input id="show-stations" type="checkbox" checked> Show bike racks</label>
        </div>
        <div id="legend" hidden>
            <p><strong>Bike Rack Density</strong></p>
            <div class="ramp"></div>
            <div class="values"><span>Low</span><span>High</span></div>
            <p>Estimated concentration of bike rack locations.</p>
        </div>
    </section>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {},
                layers: [{
                    id: 'background', type: 'background',
                    paint: { 'background-color': '#edf1f0' }
                }]
            },
            center: [-122.3321, 47.6062],
            zoom: 10,
            minZoom: 8,
            maxZoom: 12,
            maxBounds: [[-122.75, 47.10], [-122.05, 48.15]]
        });
        map.addControl(new maplibregl.NavigationControl());
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

        map.on('error', (event) => {
            document.getElementById('status').textContent =
                'Load error: check the file path and browser Console.';
            console.error(event.error);
        });

        map.on('load', () => {
            // Step 2: insert the basemap tile code here.
            map.addSource('basemap-tiles', {
                type: 'raster',
                tiles: ['assets/mapbox-guided/{z}/{x}/{y}.png'],
                tileSize: 256,
                scheme: 'xyz',
                minzoom: 8,
                maxzoom: 12,
                bounds: [-122.75, 47.10, -122.05, 48.15],
                attribution: '© Mapbox © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            });
            map.addLayer({
                id: 'basemap',
                type: 'raster',
                source: 'basemap-tiles',
                paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 }
            });

            document.getElementById('status').textContent =
                'Step 2: check your Studio basemap; pan and zoom.';

            // Step 3: insert the bike rack density tile code here.
            map.addSource('bike-rack-density-tiles', {
                type: 'raster',
                tiles: ['assets/bike-rack-density/{z}/{x}/{y}.png'],
                tileSize: 256,
                scheme: 'xyz',
                minzoom: 8,
                maxzoom: 12,
                bounds: [-122.75, 47.10, -122.05, 48.15],
                attribution: 'Bike rack locations: City of Seattle SDOT; density map by Paxton White'
            });
            map.addLayer({
                id: 'bike-rack-density-surface',
                type: 'raster',
                source: 'bike-rack-density-tiles',
                paint: { 'raster-opacity': 0.7, 'raster-fade-duration': 0 }
            });

            document.getElementById('surface-control').hidden = false;
            document.getElementById('legend').hidden = false;
            document.getElementById('show-surface').addEventListener('change', (event) => {
                map.setLayoutProperty('bike-rack-density-surface', 'visibility',
                    event.target.checked ? 'visible' : 'none');
                document.getElementById('legend').hidden = !event.target.checked;
            });
            document.getElementById('status').textContent =
                'Step 3: toggle the density surface to compare it with the basemap.';

            // Step 4: add the bike rack locations and popup code.
            map.addSource('bike-rack-data', {
                type: 'geojson',
                data: 'data/seattle_bike_racks.geojson'
            });
            map.addLayer({
                id: 'bike-racks',
                type: 'circle',
                source: 'bike-rack-data',
                paint: {
                    'circle-radius': 5,
                    'circle-color': '#18364d',
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 1.5
                }
            });

            map.on('click', 'bike-racks', (event) => {
                const feature = event.features[0];
                const rack = feature.properties;

                const details = Object.entries(rack)
                    .filter(([key, value]) => value !== null && value !== '')
                    .slice(0, 8)
                    .map(([key, value]) => key + ': ' + value);

                new maplibregl.Popup()
                    .setLngLat(feature.geometry.coordinates)
                    .setText(details.join('\n') || 'Bike rack location')
                    .addTo(map);
            });
            map.on('mouseenter', 'bike-racks', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            map.on('mouseleave', 'bike-racks', () => {
                map.getCanvas().style.cursor = '';
            });
            document.getElementById('station-control').hidden = false;
            document.getElementById('show-stations').addEventListener('change', (event) => {
                map.setLayoutProperty('bike-racks', 'visibility',
                    event.target.checked ? 'visible' : 'none');
            });
            document.getElementById('status').textContent =
                'Step 4: click a bike rack to view its attributes.';
        });
    </script>
</body>

</html>
